repos:
  - repo: builtin
    hooks:
      # File names
      - id: check-case-conflict # File formats
      - id:
          check-toml
          # Executables
          # Git shenanigans
      - id: check-merge-conflict
      - id:
          check-added-large-files
          # Python issues
          # Whitespace
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: uv-lock
        name: uv-lock
        entry: uv lock
        language: system
        files: ^(uv\.lock|pyproject\.toml|uv\.toml)$
        pass_filenames: false

      - id: normalize
        name: normalize
        entry: uv run --no-active daily-writing normalize
        types: [markdown]
        language: python

      # zizmor is not a project dependency, so run it as a one-off tool.
      - id: zizmor
        name: zizmor
        entry: uvx zizmor@1.28.0 --no-progress --fix=all
        language: system
        types: [yaml]
        files: (\.github/(workflows/.*|dependabot\.ya?ml))|(action\.ya?ml)$
        require_serial: true
